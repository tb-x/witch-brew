<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7b4bc4">
<title>Witchy Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
  /* Layout: one full-screen canvas (flying and the cauldron); the level picker and end card are HTML overlays; home top-left, sound top-right, recipe drawn top-centre */
  :root{--ink:#2a2140;--purple:#7b4bc4;--gold:#ffd447;--paper:#fff8ec;
    --title:'Fredoka','Trebuchet MS',sans-serif;--body:Verdana,Tahoma,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;color:var(--ink);font-family:var(--body);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #safe{position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none}

  #home,#sound{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);border:0;padding:0;
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none;cursor:pointer}
  #home{left:calc(10px + env(safe-area-inset-left,0px))}
  #sound{right:calc(10px + env(safe-area-inset-right,0px));font-size:22px}
  #home svg{width:24px;height:24px}
  #home:active,#sound:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding:calc(64px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));
    background:rgba(42,33,64,.28)}
  .hidden{display:none}
  #brand{display:flex;flex-direction:column;align-items:center;gap:4px}
  h1{margin:0;font-family:var(--title);font-size:clamp(38px,10vw,64px);color:#fff;letter-spacing:1px;
    text-shadow:0 4px 0 var(--purple),0 8px 14px rgba(0,0,0,.25)}
  .hero{font-size:54px;line-height:1}
  #levels{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:420px}
  .lvl{position:relative;width:86px;height:86px;border-radius:50%;border:0;background:var(--paper);font-size:44px;line-height:1;
    box-shadow:0 6px 0 var(--purple);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .lvl:active{transform:translateY(3px);box-shadow:0 3px 0 var(--purple)}
  .lvl b{position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;
    font:bold 17px/32px var(--body)}
  .lvl:disabled{opacity:.55;cursor:default}
  .lvl:disabled b{background:#777;font-size:15px}
  .panel{background:var(--paper);border-radius:28px;padding:18px 26px 24px;box-shadow:0 8px 0 var(--purple);
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .big{font-size:76px;line-height:1.1}
  .cheer{font-family:var(--title);font-size:34px;color:var(--purple)}
  .row{display:flex;gap:16px}
  .btn{width:78px;height:78px;border-radius:50%;border:0;background:#fff;font-size:36px;line-height:1;cursor:pointer;
    box-shadow:0 5px 0 var(--purple);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .btn.go{background:var(--gold)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--purple)}
  @media (orientation:landscape) and (max-height:500px){
    #menu{flex-direction:row;gap:36px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
    #levels{max-width:330px}
    .lvl{width:78px;height:78px;font-size:40px}
  }
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<button id="sound" aria-label="Sound on or off">🔊</button>
<canvas id="cv"></canvas>
<div id="safe"></div>

<div id="menu" class="overlay">
  <div id="brand"><h1>Witchy Brew</h1><div class="hero">🧙‍♀️🧹</div></div>
  <div id="levels"></div>
</div>

<div id="card" class="overlay hidden">
  <div class="panel">
    <div class="big" id="cardEmoji">🧪</div>
    <div class="cheer">Hooray!</div>
    <div class="row">
      <button class="btn" id="bMap" aria-label="All levels">🗺️</button>
      <button class="btn" id="bAgain" aria-label="Play again">🔄</button>
      <button class="btn go" id="bNext" aria-label="Next level">▶️</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ======== tuning knobs ======== */
const ASSET_V = 7;           // bump after changing any picture or sound in assets/
const VIEW_MIN = 180;        // at least this many game units across the short side of the screen (smaller = bigger witch)
const RES = 2;               // picture pixels per game unit (the PixelLab pictures are drawn at this size)
const CEIL = 8;              // soft ceiling, units below the top edge
const GROUND_H = 20;         // height of the ground strip
const WITCH_X = 0.3;         // where the witch flies across the screen (0 = left edge, 1 = right)
const WITCH_FPS = 8;         // frames a second of her flying animation (the cat's tail is a little slower)
const GRAVITY = 240;         // units/s² pulling her down
const FLAP = 100;            // upward speed one tap gives
const MAX_FALL = 70;         // she never drops faster than this, so she glides
const SPEED = 40;            // flying speed in units/s, times each level's `speed`
const PILLAR_EVERY = 125;    // distance from one obstacle to the next
const PILLAR_W = 26;         // obstacle width (what she bumps; leafy crowns stick out past it harmlessly)
const MAX_SHIFT = 45;        // most a gap moves up or down from one obstacle to the next
const ASSIST = 2;            // gentle pull towards the middle of the next gap (0 = off)
const ASSIST_RANGE = 70;     // how far ahead the pull starts
const HIT_R = 5;             // the witch's bump radius (small = forgiving)
const PICK_R = 15;           // how close she must get to catch an ingredient (big = easy)
const OOPS_TIME = 0.9;       // seconds she spins after a bump
const SAFE_TIME = 1.8;       // seconds she can pass through obstacles after a bump
const DECOY_CHANCE = 0.3;    // chance of a sock or shoe instead, on levels with `decoys`
const STIR_NEEDED = 900;     // screen pixels of stirring (dragging) to finish the potion
const STIR_TAP = 150;        // a tap counts as this much stirring
const STIR_STARS = 5;        // stars over the pot that light up one by one while you stir
const MAGIC_TIME = 5;        // seconds the potion's magic plays before the end card
// friends' powers: each one works once that friend rides the broom
const CAT_REACH = 30;        // the cat pulls ingredients this much further than catching distance towards the broom
const CAT_PULL = 70;         // ...this fast (units/s)
const FROG_REACH = 50;       // the frog's tongue grabs an ingredient up to this far away...
const FROG_EVERY = 3;        // ...once every this many seconds
const TONGUE_TIME = 0.5;     // seconds for the tongue to shoot out and reel the ingredient back in
const LANTERN_LIGHT = 110;   // on the dark night level, how far the lantern lights up around her (60 without it)
const NIGHT_DARK = 0.55;     // how dark the night level is outside that light (0 = not at all, 1 = black)
const OWL_EVERY = 5;         // the owl hoots and points at the next ingredient this often (seconds)
const STAR_RECHARGE = 8;     // the stars carry her through one obstacle, then need this many seconds to come back
const DASH_EVERY = 15;       // the unicorn's rainbow dash comes this often (seconds)...
const DASH_TIME = 2.5;       // ...lasts this long...
const DASH_SPEED = 1.6;      // ...and makes her this much faster, flying through everything
const UNICORN_EVERY = 3;     // the unicorn picks a new place to fly to (round the witch) about this often
// moving things and special pickups (each level in LEVELS says which it has)
const MOVE_AMP = 14;         // how far a moving gap bobs up and down
const WIND_EVERY = 7, WIND_TIME = 2, WIND_PUSH = 110;   // snowy gusts: how often, how long, how hard (units/s²)
const FLOCK_EVERY = 9;       // seconds between flocks of birds or bats (they scatter when she flies into them)
const FLOCK_ESCAPE = 190;    // how fast a startled bird or bat shoots off (units/s); it speeds up as it goes
const SPECIAL_CHANCE = 0.12; // chance of a comet or bubble between two obstacles
const ZOOM_TIME = 3, ZOOM_SPEED = 1.5;      // the comet: how long she zooms, and how much faster
const BUBBLE_TIME = 2.5, BUBBLE_RISE = 26;  // the bubble: how long it carries her, and how fast it floats up
const SFX_VOL = 0.5;         // loudness of the sound effects
const VOICE_VOL = 1;         // loudness of the voice (each clip is evened out first)
const MUSIC_VOL = 0.28;      // loudness of the music
const MUSIC_DUCK = 0.35;     // the music dips to this much of itself while the voice talks
const MUSIC_XFADE = 2;       // seconds of the track's end blended into its start, so the loop has no seam

const ING = {
  flower:   {e:'🌸', one:'flower',     many:'flowers',     col:'#ff8fc8', img:'ing-flower'},
  mushroom: {e:'🍄', one:'mushroom',   many:'mushrooms',   col:'#e8473f', img:'ing-mushroom'},
  berry:    {e:'🫐', one:'blueberry',  many:'blueberries', col:'#5560e0', img:'ing-berry'},
  leaf:     {e:'🍁', one:'leaf',       many:'leaves',      col:'#e8762b', img:'ing-leaf'},
  apple:    {e:'🍎', one:'apple',      many:'apples',      col:'#d9302c', img:'ing-apple'},
  feather:  {e:'🪶', one:'feather',    many:'feathers',    col:'#6fb7e8', img:'ing-feather'},
  snow:     {e:'❄️', one:'snowflake',  many:'snowflakes',  col:'#bfe6ff', img:'ing-snow'},
  star:     {e:'⭐', one:'star',       many:'stars',       col:'#ffd447', img:'ing-star'},
  moon:     {e:'🌙', one:'moon',       many:'moons',       col:'#ffe58a', img:'ing-moon'},
  drop:     {e:'💧', one:'water drop', many:'water drops', col:'#4fb3ff', img:'ing-drop'},
};
const DECOYS = {
  sock: {e:'🧦', img:'sock', say:'sock'}, shoe: {e:'👟', img:'shoe', say:'shoe'},
  fish: {e:'🐟', img:'fish', say:'fish'}, snail: {e:'🐌', img:'snail', say:'snail'},
};

// The friend each level's potion adds to the broom, in order. `img` is its picture, `frames` how many
// animation frames it has (`still`: only played when it does something), and (x, y) where it sits in the witch's
// flying picture, in picture pixels: the middle of its feet (or, for the hanging lantern, the middle of its top);
// the frog's `mouth` is in game units from its feet. The unicorn flies on its own; stars and the rainbow are trails.
const FRIENDS = [
  {name:'cat',     img:'cat', frames:8, x:23, y:70, behind:true, emoji:'🐈‍⬛'},
  {name:'frog',    img:'frog-crown', frames:7, still:true, x:89, y:62, mouth:[2.5, -5.5], emoji:'🐸'},
  {name:'lantern', img:'lantern', x:104, y:60, hang:true, emoji:'🎃'},
  {name:'owl',     img:'owl', x:67, y:27, emoji:'🦉'},
  {name:'stars',   trail:'stars', emoji:'✨'},
  {name:'unicorn', img:'unicorn', frames:8, trail:'rainbow', emoji:'🦄'},
];
// The witch's pictures (assets/witch-<anim>.png, all cut the same size): where her body and the end of her broom
// are, in picture pixels, and per animation its frames, speed, and how high the broom sits in each frame (so her
// passengers ride along with it). `fly` loops; the others play once when something happens, then she flies on.
const RIDER = {body: [53, 62], trail: [7, 80], anims: {
  fly:   {frames: 8, fps: WITCH_FPS, loop: true, broom: [61, 61, 60, 58, 58, 58, 58, 59]},
  swoop: {frames: 6, fps: 14, broom: [61, 58, 56, 58, 61, 64]},   // leaning into a tap
  cheer: {frames: 6, fps: 10, broom: [62, 59, 58, 57, 58, 61]},   // a fist in the air for an ingredient
  wave:  {frames: 6, fps: 8,  broom: [61, 61, 63, 64, 64, 63]},   // laughing and waving at a new friend
  bonk:  {frames: 6, fps: 7,  broom: [62, 64, 66, 65, 64, 62]},   // holding her hat after a bump
}};
const ACT_RANK = {fly: 0, swoop: 1, cheer: 2, wave: 2, bonk: 3};   // a bump outranks a cheer, which outranks a swoop

// sky: top and bottom colour; hills: far and near; bot/top: obstacle body and cap colours (the simple look,
// used until the pictures load). art: the level's PixelLab pictures: `far` and `near` background strips,
// `soil` (the colour under the near strip), and the obstacles: a `cap` at the gap, a `body` stacked from it
// to the ground (`bodyStep` makes it a wobbly pile instead of a column) onto a `foot` (a tree's roots), and a `top` piled up from the gap
// into the sky, `topStep` apart. magic: what else happens when the potion is ready.
// length: obstacles before her cottage (the ingredients are spread along the way); decoys: the things to avoid; moving: share of gaps that bob up and down; wind: snowy gusts;
// flock: 'birds' or 'bats' fly across; dark: only the light round the witch shows; specials: comets and bubbles.
const LEVELS = [
  {icon:'🌼', sky:['#bfe7ff','#f4fbe2'], hills:['#a6dc8f','#7cc66a'], ground:'#6bb35a',
   art:{far:'bg-meadow-far', near:'bg-meadow-near', soil:'#764d52', cap:'oak-top', body:'oak-trunk', foot:'oak-foot', top:'cloud'},
   bot:['#8a5a3c','#5fae4e'], top:['#ffffff','#f2f7ff'], recipe:{flower:3}, speed:0.9, gap:96, length:14, magic:'flowers', flock:'birds'},
  {icon:'🌲', sky:['#a6e8c2','#c8f2c0'], hills:['#5c9e62','#3f7f48'], ground:'#3f7a3c',
   art:{far:'bg-forest-far', near:'bg-forest-near', soil:'#051831', cap:'fir-top', body:'fir-trunk', foot:'fir-foot', top:'vines', topStep:30},
   bot:['#6b4428','#2f7a3a'], top:['#2f7a3a','#3d9447'], recipe:{mushroom:2, berry:2}, speed:1, gap:92, length:16, moving:0.25, flock:'birds', specials:['bubble']},
  {icon:'🎃', sky:['#9e8b94','#9e8b94'], hills:['#c98a4a','#8a6a2f'], ground:'#6b7a32',
   art:{far:'bg-autumn-far', near:'bg-autumn-near', soil:'#482a0a', cap:'hay-top', body:'hay-bale', bodyStep:22, top:'leaves-autumn', topStep:22},
   bot:['#7a5230','#e07a2a'], top:['#b46a3a','#7a4a2a'], recipe:{leaf:2, apple:2, feather:1}, speed:1.05, gap:90, length:18, decoys:['sock', 'shoe'], moving:0.3, specials:['comet', 'bubble']},
  {icon:'⛄', sky:['#c6e4f5','#e4f1f7'], hills:['#e3eefa','#cfdff0'], ground:'#f2f7ff',
   art:{far:'bg-snow-far', near:'bg-snow-near', soil:'#9ab2be', cap:'rock-top', body:'rock', top:'cloud-snow', topStep:26},
   bot:['#8d97a8','#ffffff'], top:['#c7e3ff','#ffffff'], recipe:{snow:3, berry:2}, speed:1.1, gap:88, length:20, decoys:['sock', 'shoe', 'fish'], moving:0.3, wind:true, specials:['bubble'], magic:'snow'},
  {icon:'🌙', sky:['#060d24','#060d24'], hills:['#2b2f63','#1f2550'], ground:'#2a3358', night:true,
   art:{far:'bg-night-far', near:'bg-night-near', soil:'#030d1e', cap:'tower-roof', body:'tower', top:'cloud-night', topStep:24},
   bot:['#3b3f6b','#59609a'], top:['#555c8f','#7a80b8'], recipe:{star:3, moon:1, drop:2}, speed:1.15, gap:88, length:22, decoys:['shoe', 'fish', 'snail'], moving:0.35, flock:'bats', dark:true, specials:['comet'], magic:'fireworks'},
  {icon:'🌈', sky:['#ecd8f5','#ecd8f5'], hills:['#ffe3f3','#e7f4ff'], ground:'#bdf0cc',
   art:{far:'bg-rainbow-far', near:'bg-rainbow-near', soil:'#756892', cap:'cloud-pink', body:'cloud-pink', bodyStep:18, top:'cloud-pink', topStep:20},
   bot:['#ffffff','#fff3fb'], top:['#ffffff','#f3f9ff'], recipe:{star:2, flower:2, drop:2, feather:1}, speed:1.2, gap:86, length:24, decoys:['sock', 'shoe', 'fish', 'snail'], moving:0.4, flock:'birds', specials:['comet', 'bubble'], magic:'rainbow'},
];

// Every spoken line: the key names its clip (assets/say-<key>.mp3); the text is said by the device's own
// voice if the clip can't load.
const LINES = {
  'find-1': 'Find three flowers!', 'find-2': 'Find two mushrooms and two blueberries!',
  'find-3': 'Find two leaves, two apples and one feather!', 'find-4': 'Find three snowflakes and two blueberries!',
  'find-5': 'Find three stars, one moon and two water drops!', 'find-6': 'Find two stars, two flowers, two water drops and one feather!',
  tap: 'Tap to fly!',
  oops: 'Oops!', whoops: 'Whoops!', bump: 'Bump!', sock: 'A smelly sock? No thanks!', shoe: 'An old shoe? No thanks!',
  fish: 'A smelly fish? No thanks!', snail: 'A slimy snail? No thanks!',
  zoom: 'Zoom! Super fast!', bubble: 'Whee! A bubble!', rainbow: 'Rainbow dash!', shield: 'Whoosh! The stars keep you safe!',
  home: "That's everything! Fly home!", pot: 'Tap to put them in the pot!', stir: 'Now stir! Round and round!',
  'magic-1': 'Abracadabra! A black cat! She wants to fly with you!',
  'magic-2': 'Abracadabra! A frog with a crown! He wants to fly with you!',
  'magic-3': 'Abracadabra! A pumpkin lantern for your broom!',
  'magic-4': 'Abracadabra! A snowy owl! It wants to fly with you!',
  'magic-5': 'Abracadabra! Your broom sparkles with stars!',
  'magic-6': 'Abracadabra! A rainbow, and a unicorn! Hooray!',
  hooray: 'Hooray!',
};
// counting what she catches and what goes in the pot: 'c-snow-1' is "First snowflake!" ("A feather!" when a level only needs one)
for(const k in ING){
  const most = Math.max(...LEVELS.map(l => l.recipe[k] || 0));
  for(let n = 1; n <= most; n++) LINES[`c-${k}-${n}`] = most === 1 ? `A ${ING[k].one}!` : `${['First', 'Second', 'Third'][n - 1]} ${ING[k].one}!`;
}
const SFX_KEYS = ['flap', 'pick', 'bump', 'boing', 'nope', 'splash', 'bubble', 'poof', 'pop', 'home', 'jump'];

/* ======== helpers ======== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const store = {
  get(k, d){ try{ const v = localStorage.getItem('witchbrew.' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('witchbrew.' + k, JSON.stringify(v)); }catch(e){} },
};
const hexRgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbStr = c => `rgb(${c.map(Math.round).join(',')})`;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ======== sound: ElevenLabs clips, with browser-made stand-ins ========
   The files start downloading as soon as the page opens and are decoded once the first tap unlocks audio.
   A sound effect that isn't ready is made in the browser instead, and a line that can't load is said by
   the device's own voice. */
let muted = store.get('muted', false);
let ac = null, out = null, sfxBus = null, voiceIn = null, musicBus = null, noiseBuf = null;
const FILES = {}, CLIPS = {}, READY = {}, GAINS = {};
const fetchClip = name => { const p = fetch(`assets/${name}.mp3?v=${ASSET_V}`).then(r => { if(!r.ok) throw 0; return r.arrayBuffer(); }); p.catch(() => {}); return p; };
for(const k in LINES) FILES['say-' + k] = fetchClip('say-' + k);
for(const k of SFX_KEYS) FILES['sfx-' + k] = fetchClip('sfx-' + k);
FILES.music = fetchClip('music');

function audio(){
  if(!ac){
    try{
      ac = new (window.AudioContext || window.webkitAudioContext)();
      out = ac.createGain(); out.gain.value = muted ? 0 : 1; out.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.gain.value = SFX_VOL; sfxBus.connect(out);
      const comp = ac.createDynamicsCompressor();   // evens out the voice so every line is clear
      comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.2;
      const vb = ac.createGain(); vb.gain.value = VOICE_VOL; comp.connect(vb).connect(out); voiceIn = comp;
      musicBus = ac.createGain(); musicBus.gain.value = MUSIC_VOL; musicBus.connect(out);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      for(const k in FILES){
        READY[k] = FILES[k].then(b => new Promise((ok, no) => ac.decodeAudioData(b.slice(0), ok, no)))
          .then(buf => {
            CLIPS[k] = buf;
            if(k.startsWith('say-')){ let peak = 0.01; const ch = buf.getChannelData(0); for(let i = 0; i < ch.length; i += 4) peak = Math.max(peak, Math.abs(ch[i])); GAINS[k] = Math.min(4, 0.8 / peak); }
          })
          .catch(() => { CLIPS[k] = null; });
      }
      Music.start();
    }catch(e){ ac = null; return null; }
  }
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f0, f1, dur, type = 'sine', vol = 1, delay = 0){
  if(!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);

let talking = null, talkUntil = 0;
// say a line; `queue` waits for the line being said to finish first
function say(key, queue = false){
  if(!ac || muted) return;
  const k = 'say-' + key;
  if(CLIPS[k] === undefined && READY[k]){   // still on its way: say it when it arrives, if that's soon
    const asked = performance.now();
    READY[k].then(() => { if(performance.now() - asked < 4000) say(key, queue); });
    return;
  }
  const now = ac.currentTime;
  if(queue && now < talkUntil){ setTimeout(() => say(key), (talkUntil - now) * 1000 + 120); return; }
  try{ talking && talking.stop(); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  const buf = CLIPS[k];
  if(buf){
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = buf; g.gain.value = GAINS[k] || 1; s.connect(g).connect(voiceIn); s.start();
    talking = s; talkUntil = now + buf.duration;
  } else {
    try{
      const u = new SpeechSynthesisUtterance(LINES[key]); u.lang = 'en-GB'; u.rate = 0.9; u.pitch = 1.2;
      speechSynthesis.speak(u);
    }catch(e){}
    talkUntil = now + 0.3 + LINES[key].length * 0.065;
  }
  Music.duck(talkUntil - now);
}

/* ======== music: one Eleven Music track, looped without a seam ======== */
function loopable(b){
  const X = Math.floor(MUSIC_XFADE * b.sampleRate), n = b.length - X;
  const o = ac.createBuffer(b.numberOfChannels, n, b.sampleRate);
  for(let c = 0; c < b.numberOfChannels; c++){
    const d = b.getChannelData(c), od = o.getChannelData(c);
    od.set(d.subarray(0, n));
    for(let i = 0; i < X; i++){ const u = i / X; od[i] = d[i] * Math.sin(u * Math.PI / 2) + d[n + i] * Math.cos(u * Math.PI / 2); }   // equal-power blend of the end into the start
  }
  return o;
}
const Music = {
  src: null,
  start(){
    if(!READY.music) return;
    READY.music.then(() => {
      if(this.src || !CLIPS.music) return;
      const s = ac.createBufferSource(); s.buffer = loopable(CLIPS.music); s.loop = true;
      s.connect(musicBus); s.start(); this.src = s;
    });
  },
  duck(secs){   // dip under a spoken line, then come back up
    if(!musicBus) return;
    const g = musicBus.gain, t = ac.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(MUSIC_VOL * MUSIC_DUCK, t + 0.1);
    g.setValueAtTime(MUSIC_VOL * MUSIC_DUCK, t + secs); g.linearRampToValueAtTime(MUSIC_VOL, t + secs + 0.6);
  },
};

/* ======== canvas and view ======== */
// The world is drawn into a small canvas (`buf`, drawn with `ctx`) with RES pixels per game unit, then blown
// up onto the screen canvas (`sctx`) by a whole number of device pixels, so every pixel is square.
// The recipe bar and fades are drawn sharp on the screen canvas on top.
const cv = $('cv'), sctx = cv.getContext('2d');
const buf = document.createElement('canvas'), ctx = buf.getContext('2d');
let W = 0, H = 0, dpr = 1, dev = 1, scale = 1, vw = 0, vh = 0, safeTop = 0;
const ground = () => vh - GROUND_H;
const band = () => ground() - CEIL;

function resize(){
  let frac = vh ? (witch.y - CEIL) / band() : 0.5;
  if(!isFinite(frac)) frac = 0.5;
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight); dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const px = Math.max(1, Math.floor(Math.min(cv.width, cv.height) / (VIEW_MIN * RES)));   // device pixels per picture pixel
  dev = px * RES;                                                                       // device pixels per game unit
  scale = dev / dpr;                                                                    // CSS pixels per game unit
  vw = Math.ceil(cv.width / dev); vh = Math.ceil(cv.height / dev);
  buf.width = vw * RES; buf.height = vh * RES; ctx.imageSmoothingEnabled = false;
  witch.y = CEIL + frac * band();

}

/* ======== pictures ======== */
const ART = {};
function loadArt(names){
  for(const n of names){
    const im = new Image();
    im.onload = () => {
      ART[n] = im;
      if(n.startsWith('bg-')){   // backgrounds repeat as picture + mirror image, so they join without a seam
        const c = document.createElement('canvas'), g = c.getContext('2d');
        c.width = im.width * 2; c.height = im.height;
        g.drawImage(im, 0, 0); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(im, 0, 0);
        ART[n + '-tile'] = c;
      }
    };
    im.src = `assets/${n}.png?v=${ASSET_V}`;
  }
}
loadArt([...Object.keys(RIDER.anims).map(n => 'witch-' + n), 'cottage', 'cauldron', 'comet', 'bird', 'bat', ...Object.values(DECOYS).map(d => d.img), ...FRIENDS.filter(f => f.img).map(f => f.img),

/* ======== flying: obstacles and ingredients ======== */
function wantedKind(){

    for(let n = lv.recipe[k] - got[k] - ahead; n > 0; n--) want.push(k);
  }
  return want.length ? pick(want) : null;
}

function spawnAhead(){
  while(!complete && nextX < cam + vw + 80){
    if(allGot && pillarN >= lv.length){ finishLevel(); break; }
    const b = band(), room = b - lv.gap;
    const prev = pillars[pillars.length - 1];
    const prevGy = prev ? prev.gy : 0.5;
    const gy = clamp(prevGy + rand(-1, 1) * Math.min(1, MAX_SHIFT / room), 0, 1);
    const p = {x: nextX, gy, gap: lv.gap, move: lv.moving && Math.random() < lv.moving ? {sp: rand(1.4, 2.2), ph: rand(0, 6.3)} : null};
    const cy = (lv.gap / 2 + gy * room) / b;            // gap middle as a fraction of the band
    const inGap = !p.move && Math.random() < 0.4;   // nothing waits inside a gap that moves
    const x = inGap ? p.x + PILLAR_W / 2 : p.x - (PILLAR_EVERY - PILLAR_W) / 2;
    const fy = inGap ? cy : clamp((cy + prevCy) / 2 + rand(-0.08, 0.08), 0.1, 0.9);
    // an ingredient where the plan says, and at every obstacle near the end while something is still missing
    const k = (plan.has(pillarN) || (pillarN >= lv.length - 2 && !allGot)) ? wantedKind() : null;

    else if(lv.specials && Math.random() < SPECIAL_CHANCE) items.push({x, fy, special: pick(lv.specials), t: rand(0, 6)});

function updateFly(dt){

    const boost = (witch.zoom > 0 ? ZOOM_SPEED : 1) * (witch.dash > 0 ? DASH_SPEED : 1);
    spd += (lv.speed * SPEED * boost - spd) * Math.min(1, dt * 2.5);
    cam += spd * dt;
  }

  if(state === 'ready'){
    witch.y = CEIL + band() / 2 + Math.sin(witch.t * 3) * 4; witch.vy = 0;
  } else if(state === 'home' && wx > lastPillarX + PILLAR_W + 20){
    // past the last obstacle: glide down to the cottage on her own
    const ty = g - 30;
    witch.vy = (ty - witch.y) * 1.6; witch.y += witch.vy * dt;

    if(witch.bubble > 0) witch.vy = lerp(witch.vy, -BUBBLE_RISE, Math.min(1, dt * 3));   // floating up in a bubble
    else {

      if(p && ASSIST > 0 && witch.oops <= 0) witch.vy += (gapCentre(p) - witch.y) * ASSIST * dt;
    }

    witch.y += witch.vy * dt;

    const through = witch.zoom > 0 || witch.bubble > 0 || witch.dash > 0;   // zooming, bubbling and dashing fly through everything
    if(witch.safe <= 0 && !through) for(const p2 of pillars) if(hits(p2, wx, witch.y - 2)){

    if(it.taken || it.grabbed) continue;
    const iy = CEIL + it.fy * band() + Math.sin(it.t * 3) * 2;
    const d = Math.hypot(it.x - wx, iy - (witch.y - 3));
    if(d < PICK_R) take(it);
    else if(friendShown(0) && !it.decoy && d < PICK_R + CAT_REACH && state !== 'ready'){   // the cat pulls it in
      const k = CAT_PULL * dt / d;
      it.x += (wx - it.x) * k; it.fy += ((witch.y - 3 - iy) * k) / band();
      if(Math.random() < dt * 20) parts.push({x: it.x, y: iy, vx: rand(-10, 10), vy: rand(-10, 10), life: 0.4, max: 0.4, c: '#ffe9a8', s: 1});
    }
  }
  pillars = pillars.filter(p => p.x > cam - 60);
  items = items.filter(it => it.x > cam - 60 && !(it.bat > 1.5) && !(it.taken && it.bat == null));
  spawnAhead();
}

// where the frog's mouth is in the world, with the broom tilted as it's drawn
function frogMouth(){
  const f = FRIENDS[1], a = Math.round(witch.ang / 0.06) * 0.06;
  const lx = (f.x - RIDER.body[0]) / RES + f.mouth[0], ly = (f.y - RIDER.body[1]) / RES + f.mouth[1];
  return {x: witchX() + lx * Math.cos(a) - ly * Math.sin(a), y: witch.y + lx * Math.sin(a) + ly * Math.cos(a)};
}

// the friends' powers, while she's flying
function powers(dt, wx){
  // the frog's tongue grabs an ingredient that's a little out of reach
  witch.frogT -= dt;
  if(friendShown(1) && witch.frogT <= 0){
    const it = items.find(it => !it.taken && it.kind && got[it.kind] < lv.recipe[it.kind] && it.x > wx - 10 &&
      Math.hypot(it.x - wx, CEIL + it.fy * band() - witch.y) < FROG_REACH);
    if(it){ witch.tongue = {it, x: it.x, y: CEIL + it.fy * band(), t: 0}; it.grabbed = true; sfx.tongue(); witch.frogT = FROG_EVERY; }
  }
  // the owl hoots and points at the next ingredient she needs
  witch.owlT -= dt;
  if(friendShown(3) && witch.owlT <= 0){
    witch.owlT = OWL_EVERY;
    const next = items.filter(it => !it.taken && it.kind && got[it.kind] < lv.recipe[it.kind] && it.x > wx + 10).sort((a, b) => a.x - b.x)[0];
    if(next && next !== witch.hint) sfx.hoot();
    witch.hint = next || null;
  }
  // the unicorn's rainbow dash
  if(friendShown(5) && (witch.dashT -= dt) <= 0){ witch.dashT = DASH_EVERY; witch.dash = DASH_TIME; sfx.poof(); say('rainbow'); }
  // speed lines while zooming or dashing
  if((witch.zoom > 0 || witch.dash > 0) && Math.random() < dt * 40)
    parts.push({x: wx + rand(0, vw * 0.7), y: rand(CEIL, ground()), vx: -220, vy: 0, life: 0.3, max: 0.3, c: 'rgba(255,255,255,.8)', s: rand(2, 4), line: true});
}
function timers(dt){
  if(witch.bubble > 0 && (witch.bubble -= dt) <= 0){   // the bubble pops
    witch.bubble = 0; sfx.popBubble();
    for(let i = 0; i < 14; i++){ const a = i / 14 * Math.PI * 2;
      parts.push({x: witchX() + Math.cos(a) * 26, y: witch.y - 6 + Math.sin(a) * 26, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, life: 0.4, max: 0.4, c: '#dff4ff', s: 1.5}); }
  }
  witch.zoom = Math.max(0, witch.zoom - dt);
  witch.dash = Math.max(0, witch.dash - dt);
  witch.shield = Math.max(0, witch.shield - dt);
  if(witch.tongue){   // out to the ingredient, then back to the frog's mouth with it stuck to the tip
    const tg = witch.tongue; tg.t += dt / TONGUE_TIME;
    const m = frogMouth(), u = tg.t < 0.4 ? tg.t / 0.4 : 1 - (tg.t - 0.4) / 0.6;
    tg.tipX = lerp(m.x, tg.x, ease(u)); tg.tipY = lerp(m.y, tg.y, ease(u));
    if(tg.t >= 0.4){ tg.it.x = tg.tipX; tg.it.fy = (tg.tipY - CEIL) / band(); }
    if(tg.t >= 1){ witch.tongue = null; tg.it.grabbed = false; take(tg.it); }
  }
  if(witch.hint && (witch.hint.taken || witch.hint.x < witchX() - 20)) witch.hint = null;
}
// snowy gusts push her up or down for a moment
function wind(dt){
  if((witch.windT -= dt) <= 0 && witch.wind <= 0){ witch.wind = WIND_TIME; witch.windDir = pick([-1, 1]); witch.windT = WIND_EVERY; sfx.gust(); }
  if(witch.wind > 0){
    witch.wind -= dt;
    witch.vy += WIND_PUSH * witch.windDir * dt;
    if(Math.random() < dt * 50) parts.push({x: cam + vw + 10, y: rand(CEIL, ground()), vx: -260, vy: witch.windDir * 60, life: 0.9, max: 0.9, c: 'rgba(255,255,255,.85)', s: rand(2, 4), line: true});
  }
}
// flocks of birds (or bats at night) fly across; she scatters them if she flies into them
function updateFlocks(dt, wx){
  if(state === 'fly' && (flockT -= dt) <= 0){
    flockT = FLOCK_EVERY * rand(0.7, 1.3);
    const y0 = CEIL + band() * rand(0.15, 0.7), n = 5 + Math.floor(rand(0, 3));
    for(let i = 0; i < n; i++){   // in a V, the leader in front
      const k = Math.abs(i - (n - 1) / 2);
      flocks.push({x: cam + vw + 20 + k * 9, y: y0 + (i < (n - 1) / 2 ? -k : k) * 6, vx: -28, vy: 0, ph: rand(0, 6.3), scared: false});
    }
  }
  for(const b of flocks){
    if(b.scared){ b.vx *= 1 + dt; b.vy -= FLOCK_ESCAPE * dt; }   // startled ones keep speeding up and away
    b.x += b.vx * dt; b.y += b.vy * dt + Math.sin(time * 3 + b.ph) * 4 * dt;
    if(!b.scared && Math.hypot(b.x - wx, b.y - witch.y) < 12){
      for(const o of flocks) if(!o.scared && Math.hypot(o.x - b.x, o.y - b.y) < 70){ o.scared = true; o.vx = rand(-1, 0.7) * FLOCK_ESCAPE; o.vy = -rand(0.5, 1) * FLOCK_ESCAPE; }   // the whole flock bolts
      sfx.chirp();
    }
  }
  flocks = flocks.filter(b => b.x > cam - 40 && b.y > -30);
}

/* ======== the cauldron ======== */
function startBrew(){
  state = 'brew'; fade = 1; parts = []; flyers = [];
  for(const k in lv.recipe) shown[k] = got[k];
  const basket = [];
  for(const k in lv.recipe) for(let i = 0; i < lv.recipe[k]; i++) basket.push({kind: k, state: 0, t: 0});
  brew = {phase: 'drop', basket, landed: 0, stir: 0, stirSound: 0, t: 0, magicT: 0, liquid: [111, 211, 111], target: [111, 211, 111],
    fw: 0, snow: 0, friendT: -1, friendIn: false, count: {}, lit: 0, litAt: []};
  sfx.home();
  say('pot');
}
const cauldron = () => ({x: R(vw * 0.5), y: ground() - 29});   // its potion is 14 units above y
const brewWitch = () => ({x: cauldron().x - Math.min(64, vw * 0.33), y: ground() - 36});
function basketPos(i){
  const n = brew.basket.length, sp = Math.min(28, (vw - 30) / n);
  return {x: vw / 2 + (i - (n - 1) / 2) * sp, y: Math.max(CEIL + 40, ground() - 110)};   // close above the pot on tall screens
}
// The unicorn flies about round the witch: every few seconds it picks a new place near her (ahead of her
// during a rainbow dash) and swoops there, staying on the screen. (bx, by) is the witch on the screen.
function flyUnicorn(dt, bx, by){
  if((uni.next -= dt) <= 0){
    uni.next = UNICORN_EVERY * rand(0.7, 1.3);
    [uni.tx, uni.ty] = pick([[-48, -8], [-36, -34], [-12, -46], [26, -40], [-62, 12], [40, -16]]);
  }
  const [tx, ty] = witch.dash > 0 && state === 'fly' ? [44, -6] : [uni.tx, uni.ty];
  uni.vx += ((tx - uni.ox) * 4 - uni.vx * 2.4) * dt;
  uni.vy += ((ty - uni.oy) * 4 - uni.vy * 2.4) * dt;
  uni.ox += uni.vx * dt; uni.oy += uni.vy * dt;
  uni.ox = clamp(bx + uni.ox, 12, vw - 12) - bx;
  uni.oy = clamp(by + uni.oy, CEIL + 10, ground() - 16) - by;
  if(uni.vx > 15) uni.face = 1; else if(uni.vx < -15) uni.face = -1;
}
// where friend i sits when the witch's body is at (x, y) and she isn't tilted
function friendSpot(i, x, y){
  const f = FRIENDS[i];
  if(f.name === 'unicorn') return {x: x + uni.ox, y: y + uni.oy};
  if(!f.img) return {x, y};
  return {x: x + (f.x - RIDER.body[0]) / RES, y: y + (f.y - RIDER.body[1]) / RES};
}

// the stars arching over the pot that light up as you stir
function stirStar(i){
  const c = cauldron(), a = (200 + 140 * i / (STIR_STARS - 1)) * Math.PI / 180;
  return {x: c.x + Math.cos(a) * 42, y: c.y - 14 + Math.sin(a) * 44};
}
function starPath(x, y, r){
  ctx.beginPath();
  for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
}

function brewTap(){
  if(brew.phase === 'drop'){
    const it = brew.basket.find(b => b.state === 0);
    if(it){ it.state = 1; it.t = 0; sfx.click(); }
  } else if(brew.phase === 'stir') brew.stir += STIR_TAP;
}

function updateBrew(dt){
  brew.t += dt;
  const c = cauldron(), mouth = c.y - 14;
  brew.basket.forEach(b => {
    if(b.state !== 1) return;
    b.t += dt / 0.55;
    if(b.t >= 1){
      b.state = 2; brew.landed++;
      brew.count[b.kind] = (brew.count[b.kind] || 0) + 1;
      brew.target = hexRgb(ING[b.kind].col);
      sfx.splash();
      say(`c-${b.kind}-${brew.count[b.kind]}`);
      for(let j = 0; j < 12; j++) parts.push({x: c.x + rand(-8, 8), y: mouth, vx: rand(-40, 40), vy: rand(-90, -40), g: 220, life: 0.7, max: 0.7, c: rgbStr(brew.target), s: rand(1, 2)});
      if(brew.landed === brew.basket.length){
        brew.phase = 'stir';
        say('stir', true);
      }
    }
  });
  brew.liquid = brew.liquid.map((v, i) => lerp(v, brew.target[i], Math.min(1, dt * 3)));

  // bubbles, more while stirring
  const rate = brew.phase === 'stir' ? 0.04 + 0.12 * (1 - brew.stir / STIR_NEEDED) : brew.phase === 'magic' ? 0.03 : 0.2;
  if(Math.random() < dt / rate){
    const l = brew.liquid.map(v => Math.min(255, v + 50));
    parts.push({x: c.x + rand(-16, 16), y: mouth, vx: rand(-4, 4), vy: rand(-30, -14), life: 1, max: 1, c: rgbStr(l), s: rand(1, 2.5), ring: true});
  }
  if(brew.phase === 'stir'){
    if(brew.stir - brew.stirSound > 140){ brew.stirSound = brew.stir; sfx.bubble(); }
    const lit = Math.min(STIR_STARS, Math.floor(brew.stir / STIR_NEEDED * STIR_STARS));
    while(brew.lit < lit){   // the next star lights up, with a chime a little higher each time
      const p = stirStar(brew.lit);
      brew.litAt[brew.lit] = time;
      tone(660 * 2 ** (brew.lit * 2 / 12), 660 * 2 ** (brew.lit * 2 / 12), 0.25, 'triangle', 0.35);
      for(let j = 0; j < 10; j++){ const a = rand(0, Math.PI * 2), v = rand(15, 35);
        parts.push({x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5, max: 0.5, c: pick(['#fff3a0', '#ffd447', '#ffffff']), s: 1.5, star: true}); }
      brew.lit++;
    }
    if(brew.stir >= STIR_NEEDED){
      brew.phase = 'magic'; brew.magicT = 0;
      sfx.poof(); say('magic-' + (L + 1)); act('cheer');
      for(let j = 0; j < 40; j++){ const a = rand(0, Math.PI * 2), v = rand(30, 110);
        parts.push({x: c.x, y: mouth - 6, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, g: 40, life: 1.2, max: 1.2, c: `hsl(${rand(0, 360)},90%,70%)`, s: rand(1, 2.5)}); }
    }
  }
  if(brew.phase === 'magic'){
    brew.magicT += dt;
    const h = (brew.magicT * 120) % 360;
    brew.target = hexRgb(hslHex(h));
    // the new friend jumps out of the pot (or, for the stars, they fly out to the broom)
    if(brew.magicT > 0.7 && brew.friendT < 0){ brew.friendT = 0; sfx.jump(); }
    if(brew.friendT >= 0 && !brew.friendIn){
      brew.friendT += dt / (L === 5 ? 1.6 : 1);
      if(L === 4 && Math.random() < dt * 30){
        const w = brewWitch(), [tx, ty] = trailAt(w.x, w.y), u = rand(0, 1);
        parts.push({x: lerp(c.x, tx, u), y: lerp(mouth, ty, u) - Math.sin(u * Math.PI) * 30, vx: rand(-10, 10), vy: rand(-10, 10), life: 0.8, max: 0.8, c: pick(['#fff3a0', '#ffd447']), s: 2, star: true});
      }
      if(brew.friendT >= 1){ brew.friendIn = true; sfx.pick(); act('wave'); }
    }
    if(brew.friendIn){ const w = brewWitch(), [tx, ty] = trailAt(w.x, w.y); broomTrail(dt, tx, ty, -30); }
    if(lv.magic === 'fireworks' && (brew.fw -= dt) < 0){
      brew.fw = 0.45; sfx.pop();
      const x = rand(20, vw - 20), y = rand(CEIL + 20, ground() * 0.5), hue = rand(0, 360);
      for(let j = 0; j < 26; j++){ const a = j / 26 * Math.PI * 2, v = rand(35, 55);
        parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 30, life: 1.1, max: 1.1, c: `hsl(${hue + rand(-20, 20)},95%,65%)`, s: 1.5}); }
    }
    if(lv.magic === 'snow' && (brew.snow -= dt) < 0){
      brew.snow = 0.05;
      parts.push({x: rand(0, vw), y: -4, vx: rand(-6, 6), vy: rand(14, 24), life: 6, max: 6, c: '#ffffff', s: rand(0.5, 1.5)});
    }
    if(brew.magicT > MAGIC_TIME && state === 'brew') showCard();
  }
}
function hslHex(h){
  const f = n => { const k = (n + h / 30) % 12, a = 0.8 * 0.4;   // saturation 80%, lightness 60%
    return Math.round(255 * (0.6 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}

function showCard(){
  state = 'card';
  unlocked = Math.max(unlocked, Math.min(LEVELS.length, L + 2));
  friends = Math.max(friends, L + 1);
  store.set('unlocked', unlocked); store.set('friends', friends);
  $('cardEmoji').textContent = '🧪' + FRIENDS[L].emoji;
  $('bNext').classList.toggle('hidden', L >= LEVELS.length - 1);
  $('card').classList.remove('hidden');
  if(L < LEVELS.length - 1) say('hooray', true);
}

function showMenu(){
  state = 'menu'; lv = LEVELS[Math.min(unlocked, LEVELS.length) - 1]; pillars = []; items = []; parts = []; flyers = []; brew = null;
  try{ speechSynthesis.cancel(); }catch(e){}
  const box = $('levels'); box.innerHTML = '';
  LEVELS.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lvl'; b.disabled = i >= unlocked;
    b.innerHTML = `${l.icon}<b>${i < unlocked ? i + 1 : '🔒'}</b>`;
    b.setAttribute('aria-label', 'Level ' + (i + 1));
    b.onclick = () => { audio(); startLevel(i); };
    box.appendChild(b);
  });
  $('card').classList.add('hidden'); $('menu').classList.remove('hidden');
}

/* ======== drawing ======== */
function emoji(e, x, y, size, alpha = 1, c = ctx){
  c.globalAlpha = alpha;
  c.font = `${size}px ${EMOJI_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(e, x, y);
  c.globalAlpha = 1;
}
// an ingredient: its picture when it has loaded (full size in the world, `size` wide on the screen canvas), else its emoji
function ingredient(kind, x, y, size, alpha = 1, c = ctx){
  const im = ART[ING[kind].img];
  if(!im) return emoji(ING[kind].e, x, y, size, alpha, c);
  c.globalAlpha = alpha;
  if(c === ctx) pic(im, x - uw(im) / 2, y - uh(im) / 2);
  else { c.imageSmoothingEnabled = false; const k = size / Math.max(im.width, im.height); c.drawImage(im, x - im.width * k / 2, y - im.height * k / 2, im.width * k, im.height * k); }
  c.globalAlpha = 1;
}
function decoy(d, x, y, alpha = 1){
  const im = ART[d.img];
  if(!im) return emoji(d.e, x, y, 13, alpha);
  ctx.globalAlpha = alpha; pic(im, x - uw(im) / 2, y - uh(im) / 2); ctx.globalAlpha = 1;
}
// a picture standing on (x, bottom), `k` times its size, or `e` when it hasn't loaded
function figure(n, e, x, bottom, k = 1, alpha = 1){
  const im = ART[n];
  if(!im) return emoji(e, x, bottom - 9 * k, 18 * k, alpha);
  ctx.globalAlpha = alpha; pic(im, x - uw(im) * k / 2, bottom - uh(im) * k, k); ctx.globalAlpha = 1;
}
function hill(x, a, f){ return Math.sin(x * 0.013 * f) * a + Math.sin(x * 0.031 * f + 1) * a * 0.5; }

function drawBackdrop(camX){
  const g = ground();
  const sky = ctx.createLinearGradient(0, 0, 0, vh);
  sky.addColorStop(0, lv.sky[0]); sky.addColorStop(1, lv.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, vw, vh);
  const art = lv.art || {};
  if(lv.night){
    for(let i = 0; i < 70; i++){
      const sx = ((i * 97.3 - camX * 0.05) % (vw + 20) + vw + 20) % (vw + 20) - 10, sy = (i * 53.7) % (g * 0.8);
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 2 + i);
      ctx.fillStyle = '#fff'; ctx.fillRect(R(sx), R(sy), 1, 1);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff5c8'; ctx.beginPath(); ctx.arc(R(vw * 0.8), 30, 11, 0, 7); ctx.fill();
  } else if(ART.cloud){
    // small, slow, half-see-through clouds far away (the big ones in front are obstacles)
    ctx.globalAlpha = 0.7;
    for(let i = 0; i < 4; i++){
      const span = vw + 140, cx = ((i * 170 - camX * 0.12) % span + span) % span - 70, cy = 30 + (i * 41) % 60;
      pic(ART.cloud, cx, cy, 0.5);
    }
    ctx.globalAlpha = 1;
  }
  if(ART[art.far + '-tile']) strip(ART[art.far + '-tile'], camX * 0.3, g - uh(ART[art.far]) + 6);
  else [[lv.hills[0], 0.25, 42, 16, 1], [lv.hills[1], 0.5, 20, 9, 1.6]].forEach(([col, par, up, amp, f]) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, vh);
    for(let x = 0; x <= vw + 4; x += 2) ctx.lineTo(x, g - up + hill(x + camX * par, amp, f));
    ctx.lineTo(vw, vh); ctx.fill();
  });
  if(ART[art.near + '-tile']){
    // the strips' grass line is 40 units down (art-src/prep.py), and sits just below the ground line
    ctx.fillStyle = art.soil; ctx.fillRect(0, g + 3, vw, vh - g);
    strip(ART[art.near + '-tile'], camX, g + 3 - 40);
    return;
  }
  ctx.fillStyle = lv.ground; ctx.fillRect(0, g, vw, vh - g);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, g, vw, 2);
}

// a repeating background strip, scrolled by `off`, with its top at `y`
function strip(img, off, y){
  const w = uw(img);
  for(let x = -(((R(off) % w) + w) % w); x < vw; x += w) pic(img, x, y);
}

function drawPillar(p){
  const x = p.x - cam, gc = gapCentre(p), t = gc - p.gap / 2, b = gc + p.gap / 2, g = ground(), art = lv.art || {};
  const cx = x + PILLAR_W / 2;
  const cap = ART[art.cap], body = ART[art.body], top = ART[art.top];
  if(cap && body && top){
    const odd = (p.x / PILLAR_EVERY) % 2 ? 2 : -2;
    // up from the ground: the body stacked from the cap down (a wobbly pile when it has a bodyStep), on its foot
    const step = art.bodyStep || uh(body), foot = ART[art.foot];
    for(let y = b - 4 + uh(cap) - (foot ? 0 : 8), i = 0; y < g + 4; y += step, i++){   // a tree's trunk joins its crown exactly
      const dx = art.bodyStep ? (i % 2 ? 4 : -4) + odd : 0;
      pic(body, cx - uw(body) / 2 + dx, y);
    }
    if(foot) pic(foot, cx - uw(foot) / 2, g + 4 - uh(foot));
    pic(cap, cx - uw(cap) / 2, b - 4);
    // down from the sky: a pile whose lowest piece hangs at the gap (drawn top first, so lower ones are in front)
    const ys = [];
    for(let y = t - uh(top) + 6; y > -uh(top); y -= art.topStep || 20) ys.push(y);
    ys.reverse().forEach((y, i) => pic(top, cx - uw(top) / 2 + ((ys.length - i) % 2 ? 5 : -5) + odd, y));
    return;
  }
  ctx.fillStyle = lv.top[0]; ctx.beginPath(); ctx.roundRect(x, -10, PILLAR_W, t + 10, [0, 0, 8, 8]); ctx.fill();
  ctx.fillStyle = lv.top[1]; ctx.beginPath(); ctx.ellipse(x + PILLAR_W / 2, t - 3, PILLAR_W / 2 + 5, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = lv.bot[0]; ctx.fillRect(x + 4, b + 6, PILLAR_W - 8, g - b);
  ctx.fillStyle = lv.bot[1]; ctx.beginPath(); ctx.ellipse(x + PILLAR_W / 2, b + 8, PILLAR_W / 2 + 6, 11, 0, 0, 7); ctx.fill();
}

// one friend's picture with its feet (or, if it hangs, its top) at (x, y) in the current drawing frame
function drawFriend(i, x, y){
  const f = FRIENDS[i], im = ART[f.img];
  if(!im) return emoji(f.emoji, x, y - 8, 14);
  const w = uw(im) / (f.frames || 1), h = uh(im);
  if(f.name === 'frog'){   // sits still, and opens its mouth when its tongue shoots out
    const t = witch.tongue && state !== 'brew' ? witch.tongue.t : -1;
    return frameOf(im, f.frames, t < 0 ? 0 : [1, 2, 3, 4, 4, 4, 4, 5, 6][Math.min(8, Math.floor(t * 9))], x - w / 2, y - h);
  }
  if(f.name === 'unicorn'){   // faces the way it's flying
    const fr = Math.floor(time * WITCH_FPS) % f.frames;
    if(uni.face > 0) return frameOf(im, f.frames, fr, x - w / 2, y - h / 2);
    ctx.save(); ctx.translate(R(x), 0); ctx.scale(-1, 1); frameOf(im, f.frames, fr, -w / 2, y - h / 2); ctx.restore();
    return;
  }
  if(f.frames) return frameOf(im, f.frames, Math.floor(time * WITCH_FPS * 0.75 + 3), x - w / 2, y - h);
  if(f.hang){   // the lantern swings from the broom handle, glowing
    ctx.save(); ctx.translate(R(x), R(y)); ctx.rotate(Math.round(Math.sin(time * 3) * 0.25 / 0.08) * 0.08);
    if(lv.night){ ctx.fillStyle = `rgba(255,190,80,${0.22 + Math.sin(time * 6) * 0.05})`; ctx.beginPath(); ctx.arc(0, h * 0.6, h * 0.9, 0, 7); ctx.fill(); }
    pic(im, -w / 2, 0); ctx.restore();
    return;
  }
  pic(im, x - w / 2, y - h);
}

// The witch with everyone riding with her. (x, y) is her body; `ang` tilts the whole broom.
function drawRider(x, y, ang, alpha = 1){
  const im = ART['witch-fly'];
  ctx.globalAlpha = alpha;
  if(friendShown(5)){ flyUnicorn(frameDt, x, y); drawFriend(5, x + uni.ox, y + uni.oy); }   // the unicorn flies round her on its own
  if(!im){ drawStickWitch(x, y, ang); ctx.globalAlpha = 1; return; }
  let an = RIDER.anims[witch.anim.name], fr = Math.floor(witch.anim.t * an.fps);
  if(!an.loop && fr >= an.frames){ witch.anim = {name: 'fly', t: 0}; an = RIDER.anims.fly; }   // back to flying
  if(an.loop) fr = Math.floor(time * an.fps) % an.frames;
  const bob = (an.broom[fr] - RIDER.anims.fly.broom[0]) / RES, sheet = ART['witch-' + witch.anim.name] || im;
  const ox = -RIDER.body[0] / RES, oy = -RIDER.body[1] / RES;
  ctx.save(); ctx.translate(R(x), R(y)); ctx.rotate(Math.round(ang / 0.06) * 0.06);   // tilt in whole steps so the pixels stay tidy
  const spot = i => [ox + FRIENDS[i].x / RES, oy + FRIENDS[i].y / RES + bob];
  FRIENDS.forEach((f, i) => { if(f.behind && f.img && friendShown(i)) drawFriend(i, ...spot(i)); });
  frameOf(sheet, an.frames, fr, ox, oy);
  FRIENDS.forEach((f, i) => { if(!f.behind && f.img && f.name !== 'unicorn' && friendShown(i)) drawFriend(i, ...spot(i)); });
  ctx.restore();
  ctx.globalAlpha = 1;
}

// a simple witch drawn in code, until her picture loads
function drawStickWitch(x, y, ang){
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-13, 5); ctx.lineTo(15, 3); ctx.stroke();
  ctx.fillStyle = '#e8b04a'; ctx.beginPath(); ctx.moveTo(-12, 2.5); ctx.lineTo(-23, -1); ctx.lineTo(-24, 10); ctx.lineTo(-12, 7.5); ctx.fill();
  ctx.fillStyle = '#2f6b35'; ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(5, 5); ctx.lineTo(2, -6); ctx.lineTo(-3, -6); ctx.fill();
  ctx.fillStyle = '#ffd9b3'; ctx.beginPath(); ctx.arc(0.5, -9, 3.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#4b2a86'; ctx.beginPath(); ctx.ellipse(0, -12, 7.5, 1.8, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(4, -12); ctx.lineTo(-4, -22); ctx.fill();
  ctx.restore();
}

function drawCottage(x){
  const g = ground(), im = ART.cottage;
  if(!im) return;
  pic(im, x - uw(im) / 2, g + 6 - uh(im));
  const cx = x - uw(im) / 2 + 62, cy = g + 6 - uh(im) + 5;   // the top of the chimney
  for(let i = 0; i < 3; i++){ const k = (time * 0.6 + i / 3) % 1;
    ctx.fillStyle = `rgba(235,235,245,${0.7 * (1 - k)})`; ctx.beginPath(); ctx.arc(R(cx + k * 10), R(cy - 3 - k * 24), 3 + k * 4, 0, 7); ctx.fill(); }
}

function drawFly(){
  drawBackdrop(cam);
  if(state === 'home') drawCottage(homeX - cam);
  pillars.forEach(drawPillar);
  for(const it of items){
    const x = it.x - cam, y = CEIL + it.fy * band() + Math.sin(it.t * 3) * 2;
    if(it.bat != null){
      ctx.save(); ctx.translate(x + it.bat * 90, y - it.bat * 80 + it.bat * it.bat * 40); ctx.rotate(it.bat * 8);
      decoy(it.decoy, 0, 0, Math.max(0, 1 - it.bat / 1.5)); ctx.restore();
      continue;
    }
    if(it.taken || (it.grabbed && witch.tongue && witch.tongue.t >= 0.4)) continue;
    if(it.decoy){ decoy(it.decoy, x, y); continue; }
    if(it.special === 'comet'){
      ctx.fillStyle = `rgba(255,230,120,${0.35 + Math.sin(it.t * 8) * 0.15})`; ctx.beginPath(); ctx.arc(R(x), R(y), 15, 0, 7); ctx.fill();
      if(ART.comet) pic(ART.comet, x - uw(ART.comet) / 2, y - uh(ART.comet) / 2); else emoji('🌠', x, y, 16);
      continue;
    }
    if(it.special === 'bubble'){ drawBubble(x, y, 10 + Math.sin(it.t * 4) * 0.8); continue; }
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(R(x), R(y), 14 + Math.sin(it.t * 5), 0, 7); ctx.fill();
    ingredient(it.kind, x, y, 13);
  }
  drawFlocks();
  drawParts(cam);
  const wx = witchX() - cam;
  const flicker = witch.safe > 0 && witch.oops <= 0 ? (Math.sin(time * 30) > 0 ? 1 : 0.4) : 1;
  drawRider(wx, witch.y, witch.ang + (witch.oops > 0 ? (1 - witch.oops / OOPS_TIME) * Math.PI * 2 : 0), flicker);
  if(witch.oops > 0) emoji('💫', wx + 4, witch.y - 30, 10);
  if(witch.bubble > 0) drawBubble(wx, witch.y - 6, 30);
  if(friendShown(4) && witch.shield <= 0 && state !== 'ready'){   // the stars, ready to keep her safe, circle her
    for(let i = 0; i < 3; i++){ const a = time * 2.5 + i * Math.PI * 2 / 3;
      starPath(wx + Math.cos(a) * 24, witch.y - 6 + Math.sin(a) * 10, 2.5); ctx.fillStyle = '#ffe680'; ctx.fill(); }
  }
  if(witch.tongue && witch.tongue.tipX != null){   // the frog's tongue, with the ingredient on its tip
    const m = frogMouth(), tg = witch.tongue;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#a8324e'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(m.x - cam, m.y); ctx.lineTo(tg.tipX - cam, tg.tipY); ctx.stroke();
    ctx.strokeStyle = '#ff7f9c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(m.x - cam, m.y); ctx.lineTo(tg.tipX - cam, tg.tipY); ctx.stroke();
    ctx.fillStyle = '#ff7f9c'; ctx.beginPath(); ctx.arc(tg.tipX - cam, tg.tipY, 1.8, 0, 7); ctx.fill();
    if(tg.t >= 0.4) ingredient(tg.it.kind, tg.tipX - cam, tg.tipY, 13);
  }
  if(witch.hint && !witch.hint.taken) drawHint(witch.hint);
  if(lv.dark){   // only the light round the witch shows; the lantern makes it bigger
    const r = friendShown(2) ? LANTERN_LIGHT : 60, gr = ctx.createRadialGradient(wx, witch.y, r * 0.5, wx, witch.y, r);
    gr.addColorStop(0, 'rgba(4,6,24,0)'); gr.addColorStop(1, `rgba(4,6,24,${NIGHT_DARK})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, vw, vh);
  }
}

// a soap bubble: see-through, with a shiny rim
function drawBubble(x, y, r){
  ctx.fillStyle = 'rgba(190,235,255,.25)'; ctx.beginPath(); ctx.arc(R(x), R(y), r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = `hsla(${(time * 90) % 360},90%,75%,.6)`; ctx.beginPath(); ctx.arc(R(x), R(y), r - 1, 0.2, 1.4); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(R(x - r * 0.4), R(y - r * 0.45), Math.max(1, r * 0.15), 0, 7); ctx.fill();
}
// the owl's pointer: a bouncing arrow over the next ingredient, or at the right edge when it's still off screen
function drawHint(it){
  const x = it.x - cam, y = CEIL + it.fy * band(), b = Math.abs(Math.sin(time * 5)) * 3;
  ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 0.75;
  ctx.beginPath();
  if(x < vw - 8){ const ty = y - 16 - b; ctx.moveTo(x - 4, ty - 5); ctx.lineTo(x + 4, ty - 5); ctx.lineTo(x, ty); }
  else { const ex = vw - 4 - b, ey = clamp(y, CEIL + 10, ground() - 10); ctx.moveTo(ex - 5, ey - 4); ctx.lineTo(ex - 5, ey + 4); ctx.lineTo(ex, ey); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
// little bluebirds (or purple bats), flapping
function drawFlocks(){
  const im = ART[lv.flock === 'bats' ? 'bat' : 'bird'];
  if(!im) return;
  const w = uw(im) / 6, h = uh(im);
  for(const b of flocks) frameOf(im, 6, Math.floor(time * (b.scared ? 30 : 12) + b.ph * 3), b.x - cam - w / 2, b.y - h / 2);   // frantic flapping when startled
}

function drawParts(camX){
  for(const p of parts){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    const x = R(p.x - camX), y = R(p.y);
    if(p.ring){ ctx.strokeStyle = p.c; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.arc(x, y, p.s, 0, 7); ctx.stroke(); }
    else if(p.line){ ctx.fillStyle = p.c; ctx.fillRect(x, y, p.s * 3, 0.5); }
    else if(p.star){ ctx.fillStyle = p.c; ctx.fillRect(x - p.s, y - 0.25, p.s * 2, 0.5); ctx.fillRect(x - 0.25, y - p.s, 0.5, p.s * 2); }
    else { ctx.fillStyle = p.c; ctx.fillRect(x - p.s / 2, y - p.s / 2, p.s, p.s); }
  }
  ctx.globalAlpha = 1;
}

function drawBrew(){
  drawBackdrop(cam);
  const c = cauldron(), g = ground(), mouth = c.y - 14, m = brew.phase === 'magic' ? brew.magicT : -1;
  const w = brewWitch(), wy = w.y + Math.sin(time * 3) * 2;
  if(c.x - 100 > -20) drawCottage(c.x - 100);
  if(lv.magic === 'flowers' && m >= 0){
    for(let i = 0; i < 10; i++){ const k = easeBack((m - i * 0.12) / 0.6);
      if(k > 0.05) figure('ing-flower', '🌷', (i + 0.5) * vw / 10, g + 6, k); }
  }
  if(lv.magic === 'rainbow' && m >= 0){
    const rad = Math.min(vw * 0.46, g - CEIL - 20), cols = ['#ff5a5a', '#ffa64d', '#ffe04d', '#5fd36b', '#4fa8ff', '#9a6bff'];
    ctx.lineWidth = rad * 0.07;
    cols.forEach((col, i) => { ctx.strokeStyle = col; ctx.beginPath();
      ctx.arc(vw / 2, g, rad - i * rad * 0.07, Math.PI, Math.PI + Math.PI * ease(m / 1.5)); ctx.stroke(); });
  }
  if(ART.cauldron){
    // the pot on its fire (8 frames of bubbling and flickering); its potion is centred at (30.25, 12.25) units
    // in the picture, and takes the colour of the last ingredient (painted on in 'color' mode, so the bubbles stay)
    frameOf(ART.cauldron, 8, Math.floor(time * 8), c.x - 30.25, mouth - 12.25);
    ctx.save(); ctx.globalCompositeOperation = 'color';
    ctx.fillStyle = rgbStr(brew.liquid); ctx.beginPath(); ctx.ellipse(c.x, mouth, 21, 7.5, 0, 0, 7); ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = '#2b2b3a'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 26, 18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = rgbStr(brew.liquid); ctx.beginPath(); ctx.ellipse(c.x, mouth, 20, 4.2, 0, 0, 7); ctx.fill();
  }
  // spoon
  if(brew.phase !== 'drop'){
    const a = brew.stir / 70;
    ctx.strokeStyle = '#a0703a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c.x + Math.cos(a) * 10, mouth + Math.sin(a) * 2.5); ctx.lineTo(c.x + Math.cos(a) * 16, mouth - 26); ctx.stroke();
  }
  drawParts(0);
  drawRider(w.x, wy, 0);
  // this level's friend on its way from the pot to the broom
  if(brew.friendT >= 0 && !brew.friendIn && FRIENDS[L].img){
    const t = ease(brew.friendT);
    if(L === 5){   // the unicorn flies in from the left under the rainbow
      const s = friendSpot(L, w.x, wy);
      drawFriend(L, lerp(-30, s.x, t), lerp(CEIL + 30, s.y, t) - Math.sin(t * Math.PI) * 10);
    } else {
      const s = friendSpot(L, w.x, wy), f = FRIENDS[L];
      ctx.save(); ctx.translate(lerp(c.x, s.x, t), lerp(mouth + 4, s.y, t) - Math.sin(t * Math.PI) * 45);
      ctx.rotate(Math.round((1 - t) * 4) * Math.PI / 2 * (t < 1 ? 1 : 0)); drawFriend(L, 0, f.hang ? -10 : 0); ctx.restore();
    }
  }
  // the basket of ingredients waiting at the top
  brew.basket.forEach((b, i) => {
    const p = basketPos(i);
    if(b.state === 0){
      const next = brew.basket.findIndex(q => q.state === 0) === i;
      ingredient(b.kind, p.x, p.y + (next ? Math.sin(time * 6) * 2 : 0), 16);
    } else if(b.state === 1){
      const t = b.t, x = lerp(p.x, c.x, t), y = lerp(p.y, mouth, t) - Math.sin(t * Math.PI) * 30;
      ingredient(b.kind, x, y, 16);
    }
  });
  // hints
  if(brew.phase === 'drop' && brew.basket.some(b => b.state === 0) && brew.t > 1.2){
    const i = brew.basket.findIndex(b => b.state === 0), p = basketPos(i);
    emoji('👆', p.x + 6, p.y + 22 + Math.sin(time * 6) * 3, 14);
  }
  if(brew.phase === 'stir'){
    for(let i = 0; i < STIR_STARS; i++){
      const p = stirStar(i), on = i < brew.lit, age = on ? time - brew.litAt[i] : 1;
      const r = 5.5 * (1 + (age < 0.3 ? 0.7 * (1 - age / 0.3) : 0)) + (on ? Math.sin(time * 5 + i) * 0.4 : 0);
      if(on){ ctx.fillStyle = 'rgba(255,230,120,.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.6, 0, 7); ctx.fill(); }
      starPath(p.x, p.y, r);
      ctx.fillStyle = on ? '#ffd447' : 'rgba(236,228,255,.75)'; ctx.fill();
      ctx.lineWidth = 0.75; ctx.strokeStyle = on ? '#b77b12' : 'rgba(80,60,130,.8)'; ctx.stroke();
    }
    // a finger going round the pot shows how to stir, until the stirring gets going
    if(!down && brew.stir < STIR_NEEDED * 0.6) emoji('👆', c.x + Math.cos(time * 4) * 16, mouth + 12 + Math.sin(time * 4) * 5, 14);
  }
}

function hudSlots(){
  const kinds = Object.keys(lv.recipe), n = total();
  const avail = Math.max(160, W - 130);
  const s = clamp(avail / (n * 1.15 + (kinds.length - 1) * 0.6), 22, 40);
  const width = n * s * 1.15 + (kinds.length - 1) * s * 0.6;
  let x = W / 2 - width / 2 + s * 0.575;
  const y = safeTop + 32, slots = [];
  kinds.forEach(k => {
    for(let i = 0; i < lv.recipe[k]; i++){ slots.push({kind: k, i, x, y, s}); x += s * 1.15; }
    x += s * 0.6;
  });
  return slots;
}

function drawHud(){
  if(state !== 'ready' && state !== 'fly' && state !== 'home') return;
  const slots = hudSlots(), s = slots[0].s;
  const x0 = slots[0].x - s * 0.7, x1 = slots[slots.length - 1].x + s * 0.7;
  sctx.fillStyle = 'rgba(255,248,236,.85)'; sctx.beginPath(); sctx.roundRect(x0, slots[0].y - s * 0.68, x1 - x0, s * 1.36, s * 0.68); sctx.fill();
  for(const sl of slots){
    const filled = sl.i < shown[sl.kind];
    if(!filled){ sctx.fillStyle = 'rgba(42,33,64,.1)'; sctx.beginPath(); sctx.arc(sl.x, sl.y, s * 0.48, 0, 7); sctx.fill(); }
    ingredient(sl.kind, sl.x, sl.y + 1, s * 0.82, filled ? 1 : 0.3, sctx);
  }
  for(const f of flyers){
    const t = ease(f.t), x = lerp(f.x0, f.x1, t), y = lerp(f.y0, f.y1, t) - Math.sin(t * Math.PI) * 40;
    ingredient(f.kind, x, y, lerp(24 * scale, f.s1 * 0.82, t), 1, sctx);
  }
  if(state === 'ready'){
    const x = (witchX() - cam) * scale, y = (witch.y + 30) * scale;
    emoji('👆', x, y + Math.sin(time * 6) * 6, 34, 1, sctx);
  }
}

/* ======== main loop ======== */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt; frameDt = dt;
  witch.anim.t += dt;
  if(state === 'menu' && Math.random() < dt * 0.4) act(pick(['wave', 'cheer', 'swoop']));   // showing off on the title screen
  if(state === 'menu'){
    cam += 18 * dt;
    const [tx, ty] = trailAt(vw * 0.5 + Math.sin(time * 0.7) * vw * 0.3, vh * 0.72 + Math.sin(time * 1.6) * 10);
    broomTrail(dt, tx + cam, ty, -20);
  }
  if(state === 'ready' || state === 'fly' || state === 'home') updateFly(dt);
  else if(state === 'brew' || (state === 'card' && brew)) updateBrew(dt);
  for(const p of parts){ p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if(p.g) p.vy += p.g * dt; }
  parts = parts.filter(p => p.life > 0);
  for(const f of flyers){ f.t += dt / 0.7; if(f.t >= 1){ shown[f.kind]++; } }
  flyers = flyers.filter(f => f.t < 1);
  fade = Math.max(0, fade - dt * 2.5);

  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  if(state === 'brew' || (state === 'card' && brew)) drawBrew();
  else if(state === 'menu'){
    drawBackdrop(cam);
    drawParts(cam);
    drawRider(vw * 0.5 + Math.sin(time * 0.7) * vw * 0.3, vh * 0.72 + Math.sin(time * 1.6) * 10, Math.cos(time * 1.6) * 0.12);
  }
  else drawFly();
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.imageSmoothingEnabled = false;
  sctx.drawImage(buf, 0, 0, vw * dev, vh * dev);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawHud();
  if(fade > 0){ sctx.fillStyle = `rgba(255,255,255,${fade})`; sctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}

/* ======== input ======== */
let down = false, lastP = null;
function tap(){
  if(state === 'ready'){ state = 'fly'; flap(); }
  else if(witch.bubble > 0) return;   // floating in a bubble: no flapping
  else if(state === 'fly' || (state === 'home' && witchX() <= lastPillarX + PILLAR_W + 20)) flap();
  else if(state === 'brew') brewTap();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); down = true; lastP = {x: e.clientX, y: e.clientY}; tap(); });
cv.addEventListener('pointermove', e => {
  if(!down || state !== 'brew' || brew.phase !== 'stir') return;
  brew.stir += Math.hypot(e.clientX - lastP.x, e.clientY - lastP.y);
  lastP = {x: e.clientX, y: e.clientY};
});
addEventListener('pointerup', () => { down = false; });
addEventListener('pointercancel', () => { down = false; });
addEventListener('keydown', e => {
  if(e.repeat || !(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter')) return;
  if(state === 'menu' || state === 'card') return;
  e.preventDefault(); audio(); tap();
});
$('home').addEventListener('pointerdown', e => e.stopPropagation());
$('sound').addEventListener('pointerdown', e => e.stopPropagation());
function paintSound(){ $('sound').textContent = muted ? '🔇' : '🔊'; }
$('sound').onclick = () => {
  muted = !muted; store.set('muted', muted); paintSound();
  audio(); if(out) out.gain.value = muted ? 0 : 1;
  if(muted){ try{ speechSynthesis.cancel(); }catch(e){} } else sfx.pick();
};
$('bMap').onclick = showMenu;
$('bAgain').onclick = () => { audio(); startLevel(L); };
$('bNext').onclick = () => { audio(); startLevel(Math.min(L + 1, LEVELS.length - 1)); };

addEventListener('resize', resize);
resize(); paintSound(); showMenu();
requestAnimationFrame(frame);
</script>
</body>
